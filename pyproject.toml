[build-system]
requires = ["scikit-build-core>=0.11", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "qspec"
dynamic = ["version"]
description = "Physics toolbox for laser spectroscopy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]

keywords = ["physics", "simulation", "data analysis", "atomic structure", "laser spectroscopy", "laser cooling", "coherent interaction", "quantum computing"]
authors = [
    {name = "Patrick Müller", email = "pamueller.ikp@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib",
    "numpy >= 2.0.2",
    "scipy >= 1.13.1",
    "sympy"
]

[project.urls]
homepage = "https://patmlr.github.io/qspec/"
documentation = "https://patmlr.github.io/qspec/doc/doc.html"
download = "https://pypi.org/project/qspec/#files"
source = "https://github.com/patmlr/qspec"
tracker = "https://github.com/patmlr/qspec/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"
cmake.source-dir = "qspec/_cpp/qspec_cpp"
cmake.build-type = "Release"
wheel.cmake = false
wheel.packages = ["qspec"]
wheel.exclude = [
    "qspec/_cpp/qspec_cpp/**",
    "!qspec/_cpp/qspec_cpp/build/windows-*/Release/qspec_cpp*.dll",
    "!qspec/_cpp/qspec_cpp/build/linux-*/libqspec_cpp*.so",
    "!qspec/_cpp/qspec_cpp/build/macosx-*/libqspec_cpp*.dylib",
]
sdist.exclude = [
    ".github/",
    ".vscode/",
    "docs/",
    "resources/",
]

[[tool.scikit-build.overrides]]
if.state = "sdist"
inherit.sdist.exclude = "append"
sdist.exclude = ["qspec/_cpp/qspec_cpp/build/"]

[[tool.scikit-build.overrides]]
# Compile the library with CMake in cibuildwheel (PyPI wheels), when installing from the sdist,
# on platforms without committed binaries (macOS, Linux aarch64),
# or when the environment variable QSPEC_BUILD_CPP=1 is set.
if.any.env.CIBUILDWHEEL = true
if.any.env.QSPEC_BUILD_CPP = true
if.any.from-sdist = true
if.any.platform-system = "^darwin"
if.any.platform-machine = "^aarch64$"
wheel.cmake = true
wheel.py-api = "py3"
wheel.exclude = ["qspec/_cpp/qspec_cpp/**"]
messages.after-failure = """
{bold.red}Compiling the qspec C++ library failed.{normal}
It requires CMake >= 3.22, a C++23 compiler (GCC >= 13, Clang >= 17 or MSVC 2026) and internet access
to download Boost, Eigen and fmt. See qspec/_cpp/qspec_cpp/README.md.
"""

[tool.cibuildwheel]
build = "cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
archs = ["native"]
build-verbosity = 1
test-sources = ["resources/qspec_test/smoke_test.py"]
test-command = "python resources/qspec_test/smoke_test.py"

[tool.cibuildwheel.linux]
environment-pass = ["SETUPTOOLS_SCM_PRETEND_VERSION"]

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.setuptools_scm]
# The version is derived from the latest git tag vX.Y.Z (e.g. 0.5.1.dev3+g1f15b85 three commits after v0.5.0).
# Releases set it explicitly, see .github/workflows/wheels.yml. The fallback applies without git metadata.
fallback_version = "0.0.0"

[tool.ruff]
extend-exclude = [
    "__pycache__",
    "docs/*",
    "__init__.py",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "ANN",
    "E",
    "F",
    "I",
    "ICN",
    "ISC",
    "NPY",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "TC",
    "TID",
    "UP",
]

ignore = [
    "ANN003",
    "ANN401",
    "E741",
    "RUF012",
]

[tool.ruff.lint.isort]
known-first-party = ["qspec"]
