[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "qspec"
version = "0.5.0"
description = "Physics toolbox for laser spectroscopy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
# license = {file = "LICENSE"}

keywords = ["physics", "simulation", "data analysis", "atomic structure", "laser spectroscopy", "laser cooling", "coherent interaction", "quantum computing"]
authors = [
    {name = "Patrick Müller", email = "pamueller.ikp@gmail.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    # "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "matplotlib",
    "numpy >= 2.0.2",
    "scipy >= 1.13.1",
    "sympy"
]

[project.urls]
homepage = "https://patmlr.github.io/qspec/"
documentation = "https://patmlr.github.io/qspec/doc/doc.html"
download = "https://pypi.org/project/qspec/#files"
source = "https://github.com/patmlr/qspec"
tracker = "https://github.com/patmlr/qspec/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.source-dir = "qspec/_cpp/qspec_cpp"
cmake.build-type = "Release"
# The library is loaded via ctypes and does not use the Python C API,
# so one wheel per platform (py3-none-<platform>) works for all Python 3 versions.
wheel.py-api = "py3"
wheel.packages = ["qspec"]
# The C++ sources and locally built binaries are not needed in the wheel.
# The library built by CMake is installed into qspec/_cpp/bin/ instead.
wheel.exclude = ["qspec/_cpp/qspec_cpp/**"]
sdist.exclude = [
    "qspec/_cpp/qspec_cpp/build/",
    ".github/",
    ".vscode/",
    "docs/",
    "resources/",
]

[tool.cibuildwheel]
# The wheels are not Python-version-specific. cibuildwheel builds once on the oldest version
# and only tests the same wheel on the newer versions.
build = "cp312-* cp313-* cp314-*"
skip = "*-musllinux_*"
archs = ["native"]
build-verbosity = 1
test-sources = ["resources/qspec_test/smoke_test.py"]
test-command = "python resources/qspec_test/smoke_test.py"

[tool.cibuildwheel.macos.environment]
MACOSX_DEPLOYMENT_TARGET = "11.0"

[tool.ruff]
extend-exclude = [
    "__pycache__",
    "docs/*",
    "__init__.py",
]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "ANN",
    "E",
    "F",
    "I",
    "ICN",
    "ISC",
    "NPY",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "TC",
    "TID",
    "UP",
]

ignore = [
    "ANN003",
    "ANN401",
    "E741",
    "RUF012",
]

[tool.ruff.lint.isort]
known-first-party = ["qspec"]
