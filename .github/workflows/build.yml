name: Build Wheels

on:
  push:
    branches: [test-actions]
  pull_request:

jobs:
  build-wheels:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        arch: [x64, arm64]
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_VERSION: 3.12
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build setuptools wheel

      - name: Stage platform binaries
        id: stage
        run: python tools/stage_binaries.py

      - name: Determine wheel platform name
        run: echo "PLAT_NAME=${{ steps.stage.outputs.plat_name }}" >> $GITHUB_ENV

      - name: Build platform wheel
        run: python -m build --wheel --outdir dist --plat-name $PLAT_NAME

      - name: Upload platform wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

  build-fallback:
      runs-on: ubuntu-latest
      needs: build-wheels

      steps:
        - uses: actions/checkout@v6

        - name: Setup Python
          uses: actions/setup-python@v6
          with:
            python-version: 3.12

        - name: Install build tools
          run: |
            python -m pip install --upgrade pip
            pip install build setuptools wheel

        - name: Build fallback wheel
          run: |
            rm -rf qspec/_cpp/bin
            python -m build --outdir dist

        - name: Upload fallback wheel
          uses: actions/upload-artifact@v6
          with:
            name: fallback-wheel
            path: dist/*.whl
