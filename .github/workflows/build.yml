name: Build Wheels

on:
  push:
    branches: [test-actions]
  pull_request:

jobs:
  build-wheels:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        arch: [x64, arm64]
    runs-on: ${{ matrix.os }}
    env:
      PYTHON_VERSION: 3.12
    steps:
      - uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Hatch
        run: python -m pip install --upgrade pip hatch

      - name: Stage platform binaries
        id: stage
        run: python resources/stage_binaries.py

      - name: Determine wheel platform name
        run: echo "PLAT_NAME=${{ steps.stage.outputs.plat_name }}" >> $GITHUB_OUTPUT

      - name: Build platform wheel
        run: hatch build -t wheel

      - name: Upload platform wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.whl

  build-sdist:
      runs-on: ubuntu-latest
      needs: build-wheels

      steps:
        - uses: actions/checkout@v6

        - name: Setup Python
          uses: actions/setup-python@v6
          with:
            python-version: 3.12

        - name: Install Hatch
          run: python -m pip install --upgrade pip hatch

        - name: Build sdist
          run: |
            rm -rf qspec/_cpp/bin
            hatch build -t sdist

        - name: Upload sdist
          uses: actions/upload-artifact@v6
          with:
            name: sdist
            path: dist/*.tar.gz
