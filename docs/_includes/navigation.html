<div class="topnav">
  <nav>
    <div class="topnav-container">
      <div class="topnav-icon">
        <a href="/" ><img src="/assets/img/logo_small.svg" alt="Icon" /></a>
      </div>
      <div class="topnav-content">
        <ul class="topnav-content-ul">
          {% for item in site.data.navigation %}
          <li class="topnav-content-li">
            <a href="{{ item.link }}"{% if page.url == item.link %}class="focus"{% endif %} >
              {{ item.name }}
            </a>
          </li>
          {% endfor %}
          <!--p id="topnav-hor"></p>
          <input type="text" placeholder="Search..."-->
        </ul>
      </div>
    </div>
  </nav>
</div>
